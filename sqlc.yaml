version: "2"
sql:
  - engine: "postgresql"
    schema: "internal/platform/db/migration"
    queries: "internal/platform/middleware/query"
    gen:
      go:
        package: "sqlc"
        out: "internal/platform/middleware/sqlc"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_exact_table_names: false
        emit_empty_slices: true
        omit_unused_structs: true
